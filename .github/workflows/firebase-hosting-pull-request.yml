# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
# Only changes that can alter the built site need a build and a preview.
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting-pull-request.yml"
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CV_GCATCODE }}
          projectId: cv-gcatcode
